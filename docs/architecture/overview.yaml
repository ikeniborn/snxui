---
# SNX VPN GUI Client — Architecture Overview
# Generated: 2026-02-28
# Version: 0.1.0

project:
  name: snxui
  version: "0.1.0"
  description: >
    GTK4 + Libadwaita graphical client for Check Point SNX VPN on Ubuntu/Debian.
    Supports GNOME, KDE Plasma, and XFCE desktop environments.
  language: Python
  python_version: ">=3.10"
  app_id: com.snxui.SNXui
  license: MIT
  entry_points:
    - snxui/app.py::main
  package_manager: pip / setuptools

architecture:
  pattern: Layered
  description: >
    Three-layer architecture separating the GTK4 UI, business logic (core),
    and system integration (D-Bus, polkit, XDG). Each layer communicates
    downward only; the UI layer holds references to core and system services
    injected at startup by SNXApplication.

  layers:
    presentation:
      description: >
        GTK4 + Libadwaita UI. Adw.ApplicationWindow hosts three pages in a
        ViewStack, switched via a ViewSwitcherBar. All GTK calls happen on the
        main thread; background operations post back to GLib.idle_add().
        SNXApplication is also classified here because it directly instantiates
        and wires all presentation-layer components (MainWindow and pages).
      color: "#e1f5ff"
      components:
        - snx-application
        - main-window
        - home-page
        - profiles-page
        - settings-page
        - dialogs

    business:
      description: >
        Domain logic with no UI dependencies. Handles VPN connection automation
        (pexpect/PTY), profile CRUD with atomic JSON persistence, and credential
        storage with keyring abstraction.
      color: "#fff4e1"
      components:
        - snx-backend
        - profile-manager
        - credential-store
        - types

    infrastructure:
      description: >
        OS-level integration. TrayManager registers a StatusNotifierItem D-Bus
        object. AutostartManager reads/writes the XDG autostart .desktop file.
        PrivilegeHandler wraps pkexec for root-privileged SNX invocations.
      color: "#e1ffe1"
      components:
        - tray-manager
        - autostart-manager
        - privilege-handler

    external:
      description: >
        External processes and OS services that snxui depends on at runtime
        but does not own.
      color: "#f0f0f0"
      components:
        - snx-binary
        - keyring-backend
        - dbus-session
        - polkit

quality_attributes:
  - attribute: Thread safety
    description: >
      SNXBackend uses threading.Lock for all internal state mutations.
      ProfileManager combines threading.Lock with filelock.FileLock to guard
      concurrent reads/writes from multiple processes. GTK widgets are only
      touched from the main thread via GLib.idle_add().

  - attribute: Graceful degradation
    description: >
      Every optional dependency (pexpect, dbus-python, keyring, GTK4) is
      guarded with try/import, providing meaningful fallbacks: in-memory
      credential cache, disabled tray, log-only mode.

  - attribute: Security
    description: >
      Passwords never stored in profile files; live in the OS keyring
      (libsecret/KDE Wallet). SNX is run with root privileges exclusively via
      polkit (pkexec) with a dedicated .policy action. polkit >= 0.119 required
      (CVE-2021-4034 mitigated). Password strings are never logged.

  - attribute: Portability
    description: >
      Supports GNOME, KDE Plasma, and XFCE through the StatusNotifierItem
      D-Bus specification (SNI) instead of the GTK-version-specific
      AppIndicator3. XDG Base Directory Specification honored throughout.

  - attribute: Testability
    description: >
      All constructor parameters are injectable (profile_manager,
      credential_store, snx_backend, autostart accept custom paths/mocks).
      GTK availability guarded so core tests run without a display.

key_decisions:
  - decision: pexpect for SNX automation
    rationale: >
      SNX requires an interactive TTY to accept passwords; it cannot read
      credentials from stdin or environment variables. pexpect spawns the
      binary in a pseudo-TTY satisfying this constraint without running the
      full GUI as root.

  - decision: StatusNotifierItem D-Bus tray
    rationale: >
      AppIndicator3 is incompatible with GTK4 and not natively supported in
      GNOME 40+. SNI is the cross-desktop standard supported by GNOME (via
      extension), KDE Plasma natively, and XFCE.

  - decision: filelock + threading.Lock for profiles
    rationale: >
      A user may open two GUI instances simultaneously. threading.Lock protects
      in-process races; filelock.FileLock protects cross-process races on the
      JSON file. Atomic write uses a .tmp staging file + rename.

  - decision: polkit for privilege escalation
    rationale: >
      Running the full GUI as root is a security anti-pattern. A dedicated
      polkit action (com.snxui.connect) allows the unprivileged GUI to request
      a single privileged SNX invocation with a desktop authentication dialog.

  - decision: GTK4 + Libadwaita
    rationale: >
      Libadwaita provides GNOME HIG-compliant widgets (Adw.ApplicationWindow,
      PreferencesPage, ViewStack) and automatic dark mode support with a single
      Adw.StyleManager call.

components:
  - id: snx-application
    name: SNXApplication
    layer: presentation
    path: snxui/app.py
    type: class
    description: >
      Orchestrates application startup. Instantiates all core and system
      services, creates the Adw.Application, and wires the activate/shutdown
      lifecycle hooks. Supports --minimized flag to start hidden to tray.
    public_api:
      - "SNXApplication(minimized: bool)"
      - "run() -> int"
    dependencies:
      - profile-manager
      - credential-store
      - snx-backend
      - tray-manager
      - autostart-manager
      - main-window

  - id: snx-backend
    name: SNXBackend
    layer: business
    path: snxui/core/snx_backend.py
    type: class
    description: >
      pexpect-based PTY automation for the Check Point SNX binary. Spawns the
      process, handles the password prompt, parses success/failure patterns, and
      runs a background monitor thread to detect unexpected tunnel drops.
    public_api:
      - "connect(profile, password, status_callback) -> bool"
      - "disconnect() -> bool"
      - "get_status() -> ConnectionStatus"
      - "get_cached_status() -> ConnectionStatus"
    dependencies:
      - types
      - snx-binary
    threads:
      - "snxui-monitor: periodic tunsnx interface health check"

  - id: profile-manager
    name: ProfileManager
    layer: business
    path: snxui/core/profile_manager.py
    type: class
    description: >
      CRUD service for VPN profiles. Persists profiles as JSON in
      $XDG_CONFIG_HOME/snxui/profiles.json. Atomic writes via .tmp + rename.
      Thread-safe via threading.Lock + filelock.FileLock.
    public_api:
      - "create(profile) -> Profile"
      - "get(profile_id) -> Optional[Profile]"
      - "list_all() -> list[Profile]"
      - "update(profile) -> Profile"
      - "delete(profile_id) -> bool"
      - "get_default() -> Optional[Profile]"
      - "set_default(profile_id)"
    dependencies:
      - types
    storage: "~/.config/snxui/profiles.json"

  - id: credential-store
    name: CredentialStore
    layer: business
    path: snxui/core/credential_store.py
    type: class
    description: >
      Keyring abstraction. Stores passwords under service "snxui" keyed by
      "profile:{uuid}". Probes the backend on first use; falls back to volatile
      in-memory cache if the keyring is unavailable.
    public_api:
      - "is_available() -> bool"
      - "set_password(profile_id, password) -> bool"
      - "get_password(profile_id) -> Optional[str]"
      - "delete_password(profile_id) -> bool"
      - "clear_all()"
    dependencies:
      - keyring-backend

  - id: types
    name: Core Types
    layer: business
    path: snxui/core/types.py
    type: module
    description: >
      Shared dataclasses and enumerations: Profile (VPN connection parameters),
      ConnectionStatus (runtime snapshot), and ConnectionState enum
      (DISCONNECTED, CONNECTING, CONNECTED, DISCONNECTING, ERROR).
    exports:
      - Profile
      - ConnectionStatus
      - ConnectionState

  - id: main-window
    name: MainWindow
    layer: presentation
    path: snxui/ui/main_window.py
    type: class
    description: >
      Adw.ApplicationWindow with a three-page ViewStack (Home, Profiles,
      Settings). Registers GAction instances for About and Quit. Intercepts the
      close-request signal to hide to tray when minimize_to_tray is enabled.
    dependencies:
      - home-page
      - profiles-page
      - settings-page
      - dialogs
      - tray-manager

  - id: home-page
    name: HomePage
    layer: presentation
    path: snxui/ui/home_page.py
    type: class
    description: >
      Connection status and control page. Shows status icon, profile dropdown,
      info label, spinner, and Connect/Disconnect button. Launches connect/
      disconnect in daemon threads; posts UI updates via GLib.idle_add().
    dependencies:
      - profile-manager
      - credential-store
      - snx-backend
      - dialogs
      - types

  - id: profiles-page
    name: ProfilesPage
    layer: presentation
    path: snxui/ui/profiles_page.py
    type: class
    description: >
      Profile management page. Lists profiles as Adw.ActionRows with edit/
      delete buttons. Delegates to ProfileDialog for create/edit, shows a
      confirmation AlertDialog before deletion, and clears keyring on delete.
    dependencies:
      - profile-manager
      - credential-store
      - dialogs

  - id: settings-page
    name: SettingsPage
    layer: presentation
    path: snxui/ui/settings_page.py
    type: class
    description: >
      Application preferences page. Controls autostart toggle (XDG .desktop),
      minimize-to-tray toggle, color scheme selection, and displays SNX binary
      path and polkit status.
    dependencies:
      - autostart-manager

  - id: dialogs
    name: UI Dialogs
    layer: presentation
    path: snxui/ui/dialogs.py
    type: module
    description: >
      Modal dialogs: PasswordDialog (password entry with keyring save option),
      ProfileDialog (create/edit profile form with inline validation),
      AboutDialog (Adw.AboutDialog wrapper). All use callbacks instead of
      blocking calls.
    exports:
      - PasswordDialog
      - ProfileDialog
      - AboutDialog
    dependencies:
      - types

  - id: tray-manager
    name: TrayManager
    layer: infrastructure
    path: snxui/system/tray_manager.py
    type: class
    description: >
      Manages the system tray icon via the org.kde.StatusNotifierItem D-Bus
      specification. Registers a StatusNotifierItem D-Bus object on the session
      bus and optionally registers with StatusNotifierWatcher. Emits NewIcon,
      NewStatus, NewToolTip D-Bus signals on state changes.
    public_api:
      - "start() -> bool"
      - "stop()"
      - "set_connected(connected, profile_name)"
      - "set_error(error)"
      - "on_connect_clicked(callback)"
      - "on_disconnect_clicked(callback)"
      - "on_show_window(callback)"
      - "on_quit(callback)"
    dependencies:
      - dbus-session

  - id: autostart-manager
    name: AutostartManager
    layer: infrastructure
    path: snxui/system/autostart.py
    type: class
    description: >
      Manages the XDG autostart .desktop file at
      $XDG_CONFIG_HOME/autostart/snxui.desktop. Writes the file with
      "Exec=snxui --minimized" to launch the app to tray on login.
    public_api:
      - "enable() -> bool"
      - "disable() -> bool"
      - "is_enabled() -> bool"
      - "toggle() -> bool"
    storage: "~/.config/autostart/snxui.desktop"

  - id: privilege-handler
    name: PrivilegeHandler
    layer: infrastructure
    path: snxui/system/privilege_handler.py
    type: class
    description: >
      Runs the SNX binary with root privileges via pkexec and a polkit action
      (com.snxui.connect). Validates polkit version >= 0.119 to mitigate
      CVE-2021-4034. Used for development installations; production uses the
      .deb package which installs the policy file at packaging time.
    public_api:
      - "run_snx_privileged(snx_args) -> subprocess.Popen"
      - "is_polkit_available() -> bool"
      - "check_polkit_version() -> Optional[str]"
      - "install_policy(policy_path) -> bool"
    dependencies:
      - polkit

external_dependencies:
  runtime:
    - name: pexpect
      version: ">=4.8"
      purpose: PTY automation for SNX binary interactive password prompt
    - name: keyring
      version: ">=24.0"
      purpose: Abstraction over GNOME Keyring / KDE Wallet / libsecret
    - name: SecretStorage
      version: ">=3.3"
      purpose: D-Bus Secret Service backend for keyring on Linux
    - name: filelock
      version: ">=3.12"
      purpose: Cross-process file locking for profiles.json
    - name: PyGObject
      version: ">=3.44"
      purpose: Python bindings for GTK4, Libadwaita, Gio, GLib
    - name: dbus-python
      version: system package
      purpose: D-Bus bindings for StatusNotifierItem tray integration

  dev:
    - name: pytest
      version: ">=7.0"
      purpose: Test framework
    - name: pytest-asyncio
      version: latest
      purpose: Async test support
    - name: black
      version: ">=23.0"
      purpose: Code formatter (line-length 99)
    - name: mypy
      version: ">=1.0"
      purpose: Static type checking (strict mode)
    - name: types-filelock
      version: latest
      purpose: Type stubs for filelock

  system:
    - name: snx
      purpose: Check Point SNX VPN binary (user must supply from VPN portal)
      paths:
        - /usr/bin/snx
        - /usr/local/bin/snx
        - ~/Downloads/snx
    - name: polkit / pkexec
      version: ">=0.119"
      purpose: Privilege escalation for SNX without running GUI as root
    - name: GTK4 + Libadwaita
      purpose: UI toolkit and GNOME HIG widget library
    - name: D-Bus session bus
      purpose: StatusNotifierItem tray and Secret Service keyring

data_flows:
  - flow: Connect VPN
    steps:
      1: "User clicks Connect on HomePage"
      2: "HomePage checks CredentialStore for saved password"
      3a: "Password found → _start_connect() in daemon thread"
      3b: "No password → PasswordDialog shown → user enters password → optionally saved to CredentialStore"
      4: "SNXBackend.connect() spawns SNX binary in PTY via pexpect"
      5: "pexpect sends password at prompt; waits for connected/error pattern"
      6: "On success: SNXBackend starts monitor thread; status_callback → GLib.idle_add → HomePage._apply_status"
      7: "TrayManager.set_connected(True) updates tray icon via D-Bus NewIcon signal"

  - flow: Profile lifecycle
    steps:
      1: "User opens ProfilesPage"
      2: "ProfilesPage.refresh() calls ProfileManager.list_all()"
      3: "ProfileManager reads ~/.config/snxui/profiles.json under file lock"
      4: "User clicks Add → ProfileDialog shown → user fills form → callback"
      5: "ProfilesPage calls ProfileManager.create(profile)"
      6: "ProfileManager acquires threading.Lock + FileLock, writes to .tmp, renames to profiles.json"
      7: "On delete: ProfilesPage also calls CredentialStore.delete_password(profile.id)"

  - flow: Autostart toggle
    steps:
      1: "User toggles 'Launch at Login' switch on SettingsPage"
      2: "SettingsPage._on_autostart_toggled calls AutostartManager.enable() or disable()"
      3: "AutostartManager writes/removes ~/.config/autostart/snxui.desktop"
      4: "On next login, desktop environment reads the .desktop file and launches snxui --minimized"
      5: "SNXApplication starts with minimized=True; TrayManager.start() registers SNI tray icon without showing window"

storage:
  - path: "~/.config/snxui/profiles.json"
    format: JSON
    owner: ProfileManager
    description: VPN profiles (no passwords); file-locked for cross-process safety
    schema_version: 1

  - path: "~/.config/autostart/snxui.desktop"
    format: XDG Desktop Entry
    owner: AutostartManager
    description: Optional XDG autostart entry created when 'Launch at Login' is enabled

  - path: "~/.local/share/snxui/snxui.log"
    format: plain text
    owner: logging subsystem
    description: Application log file; created on first run

  - path: OS keyring
    format: native (libsecret / KDE Wallet)
    owner: CredentialStore
    description: "Passwords keyed as 'profile:{uuid}' under service 'snxui'"

  - path: "/usr/share/polkit-1/actions/com.snxui.policy"
    format: XML polkit policy
    owner: system package / PrivilegeHandler.install_policy()
    description: polkit action definition for com.snxui.connect and com.snxui.disconnect
