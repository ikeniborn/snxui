name: Release

on:
  push:
    branches:
      - master
    paths:
      - "VERSION"

permissions:
  contents: write

jobs:
  read-version:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.read_version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Read VERSION file
        id: read_version
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building release for version: ${VERSION}"

  run-tests:
    runs-on: ubuntu-22.04
    needs: read-version
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y python3-dbus libdbus-1-dev libglib2.0-dev

      - name: Install Python dependencies
        run: |
          pip install -e ".[dev]"
          pip install pytest pytest-cov

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

  inject-versions:
    runs-on: ubuntu-22.04
    needs: [read-version, run-tests]
    outputs:
      version: ${{ needs.read-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Inject version into pyproject.toml
        run: |
          VERSION="${{ needs.read-version.outputs.version }}"
          # Update version field in pyproject.toml
          sed -i "s/^version = .*/version = \"${VERSION}\"/" pyproject.toml
          # Verify injection
          grep "^version = \"${VERSION}\"" pyproject.toml || {
            echo "ERROR: version injection failed in pyproject.toml"
            exit 1
          }

      - name: Inject version into setup.py
        run: |
          VERSION="${{ needs.read-version.outputs.version }}"
          # Update version in setup.py
          sed -i "s/version=\"[^\"]*\"/version=\"${VERSION}\"/" setup.py
          sed -i "s/version='[^']*'/version='${VERSION}'/" setup.py
          # Verify injection
          python3 -c "
          import ast, sys
          with open('setup.py') as f:
              content = f.read()
          print('setup.py updated successfully')
          " || { echo "ERROR: setup.py invalid after version injection"; exit 1; }

      - name: Update debian/changelog
        run: |
          VERSION="${{ needs.read-version.outputs.version }}"
          MAINTAINER="SNX UI Contributors <snxui@example.com>"
          DATE=$(date -R)
          # Generate new changelog entry
          NEW_ENTRY="snxui (${VERSION}-1) unstable; urgency=low\n\n  * Release ${VERSION}.\n\n -- ${MAINTAINER}  ${DATE}\n\n"
          # Prepend new entry to existing changelog
          printf "${NEW_ENTRY}" | cat - packaging/debian/changelog > /tmp/changelog.tmp
          mv /tmp/changelog.tmp packaging/debian/changelog

      - name: Upload modified sources
        uses: actions/upload-artifact@v4
        with:
          name: versioned-sources
          path: |
            pyproject.toml
            setup.py
            packaging/debian/changelog

  build-deb:
    runs-on: ubuntu-22.04
    needs: inject-versions
    steps:
      - uses: actions/checkout@v4

      - name: Download versioned sources
        uses: actions/download-artifact@v4
        with:
          name: versioned-sources

      - name: Install Debian build tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            debhelper \
            devscripts \
            python3-setuptools \
            python3-all \
            dh-python

      - name: Build DEB package
        run: |
          VERSION="${{ needs.inject-versions.outputs.version }}"
          # dpkg-buildpackage expects debian/ in CWD
          # Makefile pattern: cd packaging && dpkg-buildpackage -us -uc -b
          cp -r packaging/debian debian/
          dpkg-buildpackage -us -uc -b
          # Find and rename the built .deb
          DEB_FILE=$(ls ../snxui_*_all.deb 2>/dev/null || ls snxui_*_all.deb 2>/dev/null || find . -name "*.deb" | head -1)
          if [ -n "${DEB_FILE}" ]; then
            cp "${DEB_FILE}" "snxui_${VERSION}_all.deb"
            echo "DEB built: snxui_${VERSION}_all.deb"
          else
            echo "DEB file not found, checking parent directory..."
            ls -la ../
            DEB_FILE=$(ls ../*.deb 2>/dev/null | head -1)
            [ -n "${DEB_FILE}" ] && cp "${DEB_FILE}" "snxui_${VERSION}_all.deb"
          fi

      - name: Upload DEB artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: "snxui_${{ needs.inject-versions.outputs.version }}_all.deb"

  build-appimage:
    runs-on: ubuntu-22.04
    needs: inject-versions
    steps:
      - uses: actions/checkout@v4

      - name: Download versioned sources
        uses: actions/download-artifact@v4
        with:
          name: versioned-sources

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            python3-gi \
            python3-pip \
            libglib2.0-0 \
            libfuse2 \
            patchelf

      - name: Cache linuxdeploy tools
        uses: actions/cache@v4
        id: cache-tools
        with:
          path: ~/.local/bin
          key: linuxdeploy-tools-v1

      - name: Download linuxdeploy and appimagetool
        if: steps.cache-tools.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.local/bin
          # Download linuxdeploy
          wget -q -O ~/.local/bin/linuxdeploy \
            "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage"
          chmod +x ~/.local/bin/linuxdeploy
          # Download appimagetool
          wget -q -O ~/.local/bin/appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x ~/.local/bin/appimagetool

      - name: Install Python dependencies
        run: |
          pip install -e ".[dev]"

      - name: Build AppImage
        env:
          VERSION: ${{ needs.inject-versions.outputs.version }}
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          # Set APPIMAGE_EXTRACT_AND_RUN for CI (no FUSE)
          export APPIMAGE_EXTRACT_AND_RUN=1

          # Run the project's build-appimage.sh script
          bash packaging/appimage/build-appimage.sh "${VERSION}"

          # Use appimagetool to create the AppImage from AppDir
          appimagetool AppDir "snxui-${VERSION}-x86_64.AppImage"
          echo "AppImage built: snxui-${VERSION}-x86_64.AppImage"

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: "snxui-${{ needs.inject-versions.outputs.version }}-x86_64.AppImage"

  create-release:
    runs-on: ubuntu-22.04
    needs: [inject-versions, build-deb, build-appimage]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download DEB artifact
        uses: actions/download-artifact@v4
        with:
          name: deb-package

      - name: Download AppImage artifact
        uses: actions/download-artifact@v4
        with:
          name: appimage

      - name: Generate changelog from git log
        id: changelog
        run: |
          VERSION="${{ needs.inject-versions.outputs.version }}"
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "${PREV_TAG}" ]; then
            COMMITS=$(git log --oneline "${PREV_TAG}..HEAD" 2>/dev/null || git log --oneline -20)
          else
            COMMITS=$(git log --oneline -20)
          fi
          # Format as markdown list
          CHANGELOG=$(echo "${COMMITS}" | sed 's/^/- /')
          # Write to file to handle multiline
          cat > /tmp/release-notes.md << NOTES
          ## What's Changed in v${VERSION}

          ${CHANGELOG}

          **Full Changelog**: https://github.com/${{ github.repository }}/commits/v${VERSION}
          NOTES
          echo "prev_tag=${PREV_TAG}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.inject-versions.outputs.version }}"
          DEB_FILE="snxui_${VERSION}_all.deb"
          APPIMAGE_FILE="snxui-${VERSION}-x86_64.AppImage"

          # Verify artifacts exist
          ls -la "${DEB_FILE}" "${APPIMAGE_FILE}" || {
            echo "ERROR: One or more release artifacts not found"
            ls -la
            exit 1
          }

          gh release create "v${VERSION}" \
            --title "snxui v${VERSION}" \
            --notes-file /tmp/release-notes.md \
            "${DEB_FILE}" \
            "${APPIMAGE_FILE}"
