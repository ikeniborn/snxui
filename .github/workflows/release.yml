name: Release

on:
  push:
    branches:
      - master
    paths:
      - "VERSION"

permissions:
  contents: write

jobs:
  read-version:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.read_version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Read and validate VERSION file
        id: read_version
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          # Validate strict semver: major.minor.patch (digits only, no prefix)
          if ! printf '%s' "${VERSION}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "ERROR: VERSION '${VERSION}' is not valid semver (expected major.minor.patch, e.g. 1.2.3)"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building release for version: ${VERSION}"

  run-tests:
    runs-on: ubuntu-24.04
    needs: read-version
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        # libgirepository-2.0-dev is required by PyGObject >= 3.50 (Ubuntu 24.04+).
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            python3-dbus \
            libdbus-1-dev \
            libglib2.0-dev \
            libgirepository-2.0-dev \
            libcairo2-dev

      - name: Install Python dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short --cov=snxui --cov-report=xml

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  inject-versions:
    runs-on: ubuntu-22.04
    needs: [read-version, run-tests]
    outputs:
      version: ${{ needs.read-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Inject version into pyproject.toml
        run: |
          VERSION="${{ needs.read-version.outputs.version }}"
          # Replace "dynamic = ["version"]" in [project] with a static version field.
          sed -i "s/^dynamic = \[\"version\"\]/version = \"${VERSION}\"/" pyproject.toml
          # Remove the now-unused file-based version entry from [tool.setuptools.dynamic].
          sed -i '/^version = {file = "VERSION"}/d' pyproject.toml
          grep -q "^version = \"${VERSION}\"" pyproject.toml || {
            echo "ERROR: version injection failed in pyproject.toml"
            cat pyproject.toml
            exit 1
          }

      - name: Update debian/changelog
        run: |
          VERSION="${{ needs.read-version.outputs.version }}"
          MAINTAINER="SNX UI Contributors <snxui@example.com>"
          # Use the commit date (RFC 2822) instead of date -R to keep the
          # changelog entry deterministic for the same git commit.
          DATE=$(git log -1 --format='%aD')
          # Use printf with explicit format args to avoid shell expansion of arbitrary values
          {
            printf 'snxui (%s-1) unstable; urgency=low\n\n' "${VERSION}"
            printf '  * Release %s.\n\n' "${VERSION}"
            printf ' -- %s  %s\n\n' "${MAINTAINER}" "${DATE}"
          } | cat - packaging/debian/changelog > /tmp/changelog.tmp
          mv /tmp/changelog.tmp packaging/debian/changelog

      - name: Upload modified sources
        uses: actions/upload-artifact@v4
        with:
          name: versioned-sources
          path: |
            pyproject.toml
            packaging/debian/changelog

  build-deb:
    runs-on: ubuntu-22.04
    needs: inject-versions
    steps:
      - uses: actions/checkout@v4

      - name: Download versioned sources
        uses: actions/download-artifact@v4
        with:
          name: versioned-sources

      - name: Install Debian build tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            debhelper \
            devscripts \
            python3-pip \
            python3-setuptools \
            python3-wheel \
            dh-python

      - name: Build DEB package
        run: |
          VERSION="${{ needs.inject-versions.outputs.version }}"
          # dpkg-buildpackage must run from project root with debian/ as a direct subdirectory.
          # packaging/debian/ cannot be used directly because debian/rules references
          # source files (pyproject.toml, snxui/) relative to the project root.
          cp -r packaging/debian debian/
          dpkg-buildpackage -us -uc -b
          # dpkg-buildpackage places output in the parent of the project root
          PARENT_DIR=$(cd .. && pwd)
          # Match version with optional debian revision suffix (e.g. 0.1.0-1)
          DEB_FILE=$(ls "${PARENT_DIR}/snxui_${VERSION}-1_all.deb" 2>/dev/null \
                  || ls "${PARENT_DIR}/snxui_${VERSION}_all.deb" 2>/dev/null \
                  || find "${PARENT_DIR}" -maxdepth 1 -name "snxui_${VERSION}*_all.deb" -print -quit)
          if [ -z "${DEB_FILE}" ]; then
            echo "ERROR: DEB file not found after build in ${PARENT_DIR}"
            ls -la "${PARENT_DIR}/"
            exit 1
          fi
          cp "${DEB_FILE}" "snxui_${VERSION}.deb"
          echo "DEB built: snxui_${VERSION}.deb ($(du -sh "snxui_${VERSION}.deb" | cut -f1))"

      - name: Upload DEB artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: "snxui_${{ needs.inject-versions.outputs.version }}.deb"

  build-rpm:
    runs-on: ubuntu-22.04
    container:
      image: fedora:latest
    needs: inject-versions
    steps:
      - name: Install RPM build tools
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            git \
            rpm-build \
            python3-pip \
            python3-setuptools \
            python3-wheel \
            python3-devel

      - uses: actions/checkout@v4

      - name: Download versioned sources
        uses: actions/download-artifact@v4
        with:
          name: versioned-sources

      - name: Build RPM package
        run: |
          VERSION="${{ needs.inject-versions.outputs.version }}"
          mkdir -p ~/rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          # Inject version into spec and add a dated changelog entry
          DATE=$(date +"%a %b %d %Y")
          sed "s/^Version:.*$/Version:        ${VERSION}/" \
              packaging/rpm/snxui.spec > ~/rpmbuild/SPECS/snxui.spec
          sed -i \
              -e "s/\* Wed Mar 04 2026/* ${DATE}/" \
              -e "s/ - 0\.0\.0-1$/ - ${VERSION}-1/" \
              ~/rpmbuild/SPECS/snxui.spec
          # Build binary-only RPM from the checked-out source tree
          rpmbuild -bb \
              --define "_topdir ${HOME}/rpmbuild" \
              --define "srcdir $(pwd)" \
              ~/rpmbuild/SPECS/snxui.spec
          # Locate the built RPM and copy it with a dist-tag-free name
          RPM_FILE=$(find ~/rpmbuild/RPMS/ -name "snxui-${VERSION}*.noarch.rpm" | head -1)
          if [ -z "${RPM_FILE}" ]; then
            echo "ERROR: RPM file not found after build"
            find ~/rpmbuild/RPMS/ -ls
            exit 1
          fi
          cp "${RPM_FILE}" "snxui-${VERSION}.noarch.rpm"
          echo "RPM built: snxui-${VERSION}.noarch.rpm ($(du -sh "snxui-${VERSION}.noarch.rpm" | cut -f1))"

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpm-package
          path: "snxui-${{ needs.inject-versions.outputs.version }}.noarch.rpm"

  build-appimage:
    runs-on: ubuntu-24.04
    needs: inject-versions
    steps:
      - uses: actions/checkout@v4

      - name: Download versioned sources
        uses: actions/download-artifact@v4
        with:
          name: versioned-sources

      - name: Install build dependencies
        # gcc + pkg-config + dev headers are required by pip when compiling
        # PyGObject and dbus-python inside the bundled Python environment.
        # libgirepository-2.0-dev: required by PyGObject >= 3.50 (Ubuntu 24.04+).
        # libgirepository1.0-dev: required by build-appimage.sh validation check
        #   (pkg-config gobject-introspection-1.0) and for bundled typelibs.
        # libdbus-1-dev: required to compile dbus-python (provides dbus/dbus.h).
        # squashfs-tools is required by appimagetool to create the squashfs layer.
        # libfuse2 is a fallback; APPIMAGE_EXTRACT_AND_RUN=1 bypasses FUSE at runtime.
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            gcc \
            pkg-config \
            libgirepository-2.0-dev \
            libgirepository1.0-dev \
            libcairo2-dev \
            libglib2.0-dev \
            libdbus-1-dev \
            libfuse2 \
            squashfs-tools

      - name: Cache AppImage build artefacts (Python standalone + appimagetool)
        uses: actions/cache@v4
        with:
          path: .appimage-cache
          # Include requirements-appimage.txt so that pinning changes bust the cache.
          key: appimage-cache-${{ hashFiles('packaging/appimage/build-appimage.sh', 'packaging/appimage/requirements-appimage.txt') }}

      - name: Build AppImage
        # build-appimage.sh handles everything:
        #   - downloads python-build-standalone into .appimage-cache/
        #   - installs all Python dependencies into the bundled Python
        #   - creates AppDir with correct structure
        #   - downloads appimagetool into .appimage-cache/
        #   - runs appimagetool to produce snxui-VERSION-x86_64.AppImage
        # APPIMAGE_EXTRACT_AND_RUN=1 lets AppImage tools run without FUSE on CI.
        env:
          VERSION: ${{ needs.inject-versions.outputs.version }}
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          bash packaging/appimage/build-appimage.sh "${VERSION}"
          if [ ! -f "snxui-${VERSION}-x86_64.AppImage" ]; then
            echo "ERROR: AppImage not found after build"
            ls -la
            exit 1
          fi
          echo "AppImage built: snxui-${VERSION}-x86_64.AppImage ($(du -sh "snxui-${VERSION}-x86_64.AppImage" | cut -f1))"

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: "snxui-${{ needs.inject-versions.outputs.version }}-x86_64.AppImage"

  create-release:
    runs-on: ubuntu-22.04
    needs: [inject-versions, build-deb, build-appimage, build-rpm]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download DEB artifact
        uses: actions/download-artifact@v4
        with:
          name: deb-package

      - name: Download AppImage artifact
        uses: actions/download-artifact@v4
        with:
          name: appimage

      - name: Download RPM artifact
        uses: actions/download-artifact@v4
        with:
          name: rpm-package

      - name: Generate changelog from git log
        run: |
          VERSION="${{ needs.inject-versions.outputs.version }}"
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "${PREV_TAG}" ]; then
            COMMITS=$(git log --oneline "${PREV_TAG}..HEAD")
          else
            COMMITS=$(git log --oneline -20)
          fi
          # Write release notes with printf to avoid heredoc shell expansion.
          # Commit messages may contain $VAR or backticks; printf '%s' prints them literally.
          {
            printf '## What'"'"'s Changed in v%s\n\n' "${VERSION}"
            printf '%s\n' "${COMMITS}" | sed 's/^/- /'
            printf '\n**Full Changelog**: https://github.com/%s/commits/v%s\n' \
              "${{ github.repository }}" "${VERSION}"
          } > /tmp/release-notes.md
          echo "--- Release notes preview ---"
          cat /tmp/release-notes.md

      - name: Verify release artifacts
        run: |
          VERSION="${{ needs.inject-versions.outputs.version }}"
          for f in \
              "snxui_${VERSION}.deb" \
              "snxui-${VERSION}-x86_64.AppImage" \
              "snxui-${VERSION}.noarch.rpm"; do
            if [ ! -f "${f}" ]; then
              echo "ERROR: Missing release artifact: ${f}"
              ls -la
              exit 1
            fi
            echo "OK: ${f} ($(du -sh "${f}" | cut -f1))"
          done

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.inject-versions.outputs.version }}"
          gh release create "v${VERSION}" \
            --title "snxui v${VERSION}" \
            --notes-file /tmp/release-notes.md \
            "snxui_${VERSION}.deb" \
            "snxui-${VERSION}-x86_64.AppImage" \
            "snxui-${VERSION}.noarch.rpm"
