name: CI

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "VERSION"
  pull_request:
    branches: [main, master]
    paths-ignore:
      - "VERSION"

jobs:
  test:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y python3-dbus libdbus-1-dev libglib2.0-dev

      - name: Install Python dependencies
        run: |
          pip install -e ".[dev]"
          pip install pytest pytest-cov

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short --cov=snxui --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  build-deb:
    runs-on: ubuntu-22.04
    needs: test
    if: github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get install -y debhelper devscripts python3-setuptools
      - name: Validate Debian package structure
        run: |
          if [ -f packaging/debian/control ]; then
            echo "Debian control file exists"
            cat packaging/debian/control
          fi
